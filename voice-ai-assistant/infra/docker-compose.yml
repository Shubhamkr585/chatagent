version: "3.9"

services:
  orchestrator:
    build:
      context: ../orchestrator
    container_name: voice-ai-orchestrator
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/voice_ai
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - redis
      - postgres
      - ai-service

  ai-service:
    build:
      context: ../ai-service
    container_name: voice-ai-python
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_PORT: 8000
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: voice-ai-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: voice-ai-postgres
    environment:
      POSTGRES_DB: voice_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
